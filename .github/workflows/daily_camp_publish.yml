name: Daily Instagram Story Automation

on:
  schedule:
    # Runs every day at 06:00 UTC (09:00 Turkey Time UTC+3)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      day_override:
        description: 'Belirli bir günü zorla çalıştır (Boş bırakılırsa sıradaki gün)'
        required: false
        default: ''
      generate_video:
        description: 'Reels Videosu da üretilsin mi? (true/false)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  publish_daily_story:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Kodu İndir (Checkout Repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Gereksinimleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Günlük Hikayeyi Üret ve Instagram'a Gönder
        env:
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          ARGS=""
          if [ "${{ inputs.generate_video }}" = "true" ]; then
            ARGS="$ARGS --video"
          fi
          if [ -n "${{ inputs.day_override }}" ]; then
            ARGS="$ARGS --day ${{ inputs.day_override }}"
          fi
          python publisher/instagram_publisher.py $ARGS

      - name: 💾 Durumu ve Üretilen Görselleri Kaydet (Git Commit & Push)
        run: |
          git config --global user.name "Müfit Hoca Bot"
          git config --global user.email "bot@mufithocailematematik.com"
          git add data/ dist/
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "chore(auto-publish): Günlük hikaye paylaşıldı ve state güncellendi [skip ci]"
            git push
          fi
